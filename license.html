<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>Activar licencia</title>
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="license.css" />
</head>
<body>
  <main class="license-page">

    <!-- Icono / logo -->
    <div class="app-icon">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#0a84ff"/>
        <path d="M24 10C18 10 13 15 13 22c0 5 3 9.5 7.5 11.5V36h7v-2.5C31.5 31.5 35 27 35 22c0-7-5-12-11-12z"
              fill="white" opacity="0.9"/>
        <rect x="18.5" y="36" width="11" height="3" rx="1.5" fill="white" opacity="0.7"/>
      </svg>
    </div>

    <h1 class="title">Activar acceso</h1>
    <p class="subtitle">Pega o escribe tu clave de licencia para continuar.</p>

    <!-- Campos segmentados de la clave -->
    <div class="segments-row" id="segmentsRow">
      <input id="seg0" class="seg-input" type="text" inputmode="text"
             maxlength="4" placeholder="····" autocomplete="off" spellcheck="false"
             autocorrect="off" autocapitalize="characters" />
      <span class="seg-sep">–</span>
      <input id="seg1" class="seg-input" type="text" inputmode="text"
             maxlength="4" placeholder="····" autocomplete="off" spellcheck="false"
             autocorrect="off" autocapitalize="characters" />
      <span class="seg-sep">–</span>
      <input id="seg2" class="seg-input" type="text" inputmode="text"
             maxlength="4" placeholder="····" autocomplete="off" spellcheck="false"
             autocorrect="off" autocapitalize="characters" />
      <span class="seg-sep">–</span>
      <input id="seg3" class="seg-input" type="text" inputmode="text"
             maxlength="4" placeholder="····" autocomplete="off" spellcheck="false"
             autocorrect="off" autocapitalize="characters" />
    </div>

    <!-- Hint de pegado -->
    <div class="paste-hint" id="pasteHint">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" width="16" height="16">
        <path d="M7 2h6a1 1 0 0 1 1 1v1H6V3a1 1 0 0 1 1-1Z" fill="#0a84ff"/>
        <rect x="4" y="5" width="12" height="13" rx="2" fill="#0a84ff" opacity="0.2"
              stroke="#0a84ff" stroke-width="1.2"/>
        <path d="M7 9h6M7 12h4" stroke="#0a84ff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>Manten pulsado el primer campo y elige <strong>Pegar</strong> — se rellena todo automáticamente</span>
    </div>

    <button id="activateBtn" class="activate-btn" type="button" disabled>
      Activar
    </button>

    <p id="licenseMsg" class="license-msg"></p>

  </main>

  <script src="license.js"></script>
</body>
</html>
